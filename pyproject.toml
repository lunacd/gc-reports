[project]
name = "gc-reports"
version = "0.1.0"
description = "Enhanced reports for gnucash"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "pydantic>=2.14.1",
    "xy>=0.0.6",
]

[project.scripts]
gc-reports = "gc_reports.main:main"

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.3", "ty>=0.0.72"]
